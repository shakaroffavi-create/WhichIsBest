[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/analyze"
  to = "/.netlify/functions/analyze"
  status = 200

[[redirects]]
  from = "/api/research"
  to = "/.netlify/functions/research"
  status = 200

[[redirects]]
  from = "/api/dealdesk"
  to = "/.netlify/functions/dealdesk"
  status = 200

[[redirects]]
  from = "/api/dealdesk-extract"
  to = "/.netlify/functions/dealdesk-extract"
  status = 200

[[redirects]]
  from = "/api/option-fair-value"
  to = "/.netlify/functions/option-fair-value"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"
